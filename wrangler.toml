name = "domain-desk"
main = "src/worker.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "domain-desk"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "domain-desk-attachments"

[[send_email]]
name = "EMAIL"

[vars]
LOCAL_DEV = "false"
ACCESS_TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
ACCESS_AUD = "replace-with-access-application-aud"
# Public widget key; the secret is set with: wrangler secret put TURNSTILE_SECRET_KEY
TURNSTILE_SITE_KEY = "replace-with-turnstile-site-key"

[env.local.vars]
LOCAL_DEV = "true"
ACCESS_TEAM_DOMAIN = "http://local.invalid"
ACCESS_AUD = "local-development-only"
# Cloudflare's documented always-pass Turnstile test keys; safe and local-only.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"

[[env.local.d1_databases]]
binding = "DB"
database_name = "domain-desk"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.local.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "domain-desk-attachments"

[[env.local.send_email]]
name = "EMAIL"
